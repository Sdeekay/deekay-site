<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Square background: light blue-gray makes both navy and accent blue pop -->
  <rect width="400" height="400" rx="72" fill="#EEF2F7"/>

  <!-- K upper arm (accent blue) — drawn below D, visible through D's inner opening and beyond D to the right -->
  <polygon fill="#A8C5DA" points="94,179 94,221 370,95 370,53"/>

  <!-- K lower arm (lighter accent blue — depth effect) -->
  <polygon fill="#C9DCEA" points="94,179 94,221 370,347 370,305"/>

  <!-- D: dark navy, fill-rule evenodd punches the inner opening,
       revealing the K arms through the hollow and showing them outside the D -->
  <path fill-rule="evenodd" fill="#1B2A4A"
    d="M 28,42 L 68,42
       C 176,42 278,118 278,200
       C 278,282 176,358 68,358
       L 28,358 Z
       M 94,94
       C 190,94 222,148 222,200
       C 222,252 190,306 94,306 Z"/>
</svg>
